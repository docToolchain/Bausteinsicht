sonar.projectKey=docToolchain_Bausteinsicht
sonar.organization=doctoolchain

# Go coverage report generated by sonarcloud.yml
sonar.go.coverage.reportPaths=coverage.out

# Go test files are not production code — exclude from coverage and duplication analysis.
sonar.coverage.exclusions=**/*_test.go
sonar.cpd.exclusions=**/*_test.go

# Tell SonarCloud which files are test sources so it doesn't count them as new code.
sonar.test.inclusions=**/*_test.go

# Source encoding
sonar.sourceEncoding=UTF-8

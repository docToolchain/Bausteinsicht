# SonarCloud Project Configuration for Bausteinsicht (Go project)

# Project Identification
sonar.projectKey=docToolchain_Bausteinsicht
sonar.projectName=Bausteinsicht
sonar.organization=doctoolchain
sonar.host.url=https://sonarcloud.io

# Source Code
sonar.sources=.
sonar.inclusions=**/*.go
sonar.test.inclusions=**/*_test.go

# Go Coverage
# coverage.out is generated by: go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out

# Coverage exclusions — keep this list as short as it can possibly be.
# - *_test.go and testdata: test infrastructure, not product code
# - *_windows.go, *_darwin.go: build constraints keep these out of the Linux
#   build that produces coverage.out, so they would report 0% for a purely
#   structural reason. Removable once coverage from the windows/macos CI legs
#   is merged into one profile — see #612.
# cmd/**/*.go used to be excluded here as "CLI wiring, low business-logic
# density". #582 disproved that: a lowercase-only key validator shipped in
# cmd/ and no coverage signal flagged it. User-facing validation lives here.
# NOTE: do NOT expand this list for internal/* packages — that hides real gaps.
# See: Quality Gate Override Policy in CLAUDE.md for approved workarounds.
sonar.coverage.exclusions=**/*_test.go,**/testdata/**,**/*_windows.go,**/*_darwin.go

# Duplication exclusions
sonar.cpd.exclusions=**/*_test.go

# Quality Gate
# New-code-coverage threshold is set to 80% in the SonarCloud UI quality gate
# (verified live via PR #621: "58.7% Coverage on New Code (required >= 80%)" —
# corrected from a previously-documented but inaccurate 65%, see #612).
# "Verified behavior-preserving refactors" may be admin-merged if the gate
# trips on legacy untested lines — see override policy in CLAUDE.md.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Branch / PR Analysis
sonar.pullrequest.github.repository=docToolchain/Bausteinsicht
sonar.pullrequest.provider=GitHub

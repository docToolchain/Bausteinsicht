.0469,80.5,263.0469,90.5,267.0469,86.5,263.0469" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="84.5" x2="484.5" y1="263.0469" y2="263.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="241" x="96.5" y="257.981">6. Log + display summary of changes</text><polygon fill="#A80036" points="233.5,288.1797,243.5,292.1797,233.5,296.1797,237.5,292.1797" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="79.5" x2="239.5" y1="292.1797" y2="292.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="58" x="86.5" y="287.1138">7. Ctrl+C</text><polygon fill="#A80036" points="473.5,317.3125,483.5,321.3125,473.5,325.3125,477.5,321.3125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="245.5" x2="479.5" y1="321.3125" y2="321.3125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="56" x="252.5" y="316.2466">8. Stop()</text><!--MD5=[da21f11a18cdb9f0fa93fb3185be11be]
@startuml watch_mode
title Watch Mode

participant "Software Architect" as architect
participant "Core" as bausteinsicht_cli_core
participant "Watcher" as bausteinsicht_watcher
participant "Engine" as bausteinsicht_sync_engine

architect -> bausteinsicht_cli_core : 1. bausteinsicht watch
bausteinsicht_cli_core -> bausteinsicht_watcher : 2. Start(model.jsonc, arch.drawio)
bausteinsicht_watcher -> bausteinsicht_watcher : 3. on file change: debounce 300ms
bausteinsicht_watcher -> bausteinsicht_sync_engine : 4. Run(model, document, state, templates, opts)
bausteinsicht_sync_engine - -> bausteinsicht_watcher : 5. SyncResult
bausteinsicht_watcher - -> architect : 6. Log + display summary of changes
architect -> bausteinsicht_cli_core : 7. Ctrl+C
bausteinsicht_cli_core -> bausteinsicht_watcher : 8. Stop()

@enduml


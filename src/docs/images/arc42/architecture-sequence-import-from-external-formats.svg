acingAndGlyphs" textLength="286" x="96.5" y="228.8481">5. ‑‑dry-run: print generated JSONC to stdout</text><polygon fill="#A80036" points="1248.5,259.0469,1258.5,263.0469,1248.5,267.0469,1252.5,263.0469" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="593.5" x2="1254.5" y1="263.0469" y2="263.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="462" x="600.5" y="257.981">6. write: Save(architecture.jsonc, model) — exit 2 if exists without ‑‑force</text><polygon fill="#A80036" points="90.5,288.1797,80.5,292.1797,90.5,296.1797,86.5,292.1797" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="84.5" x2="592.5" y1="292.1797" y2="292.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="246" x="96.5" y="287.1138">7. 'Imported model written' + warnings</text><!--MD5=[f470ee99187df2267d98bdc5396dd289]
@startuml import_from_external_formats
title Import from Structurizr / LikeC4 / XMI

participant "Software Architect" as architect
participant "Tooling" as bausteinsicht_cli_tooling
participant "Importer" as bausteinsicht_importer
participant "Loader" as bausteinsicht_model_loader

architect -> bausteinsicht_cli_tooling : 1. bausteinsicht import workspace.dsl ‑‑from structurizr|likec4|xmi [‑‑dry-run]
bausteinsicht_cli_tooling -> bausteinsicht_importer : 2. Import(file, format)
bausteinsicht_importer -> bausteinsicht_importer : 3. parse source, map people/systems/containers + relationships
bausteinsicht_importer - -> bausteinsicht_cli_tooling : 4. ImportResult{Model, Warnings}
bausteinsicht_cli_tooling - -> architect : 5. ‑‑dry-run: print generated JSONC to stdout
bausteinsicht_cli_tooling -> bausteinsicht_model_loader : 6. write: Save(architecture.jsonc, model) — exit 2 if exists without ‑‑force
bausteinsicht_cli_tooling - -> architect : 7. 'Imported model written' + warnings

@enduml


st="spacingAndGlyphs" textLength="466" x="344.5" y="186.7153">4. pure additions: PatchInsert / AppendArrayEntry (comments preserved)</text><polygon fill="#A80036" points="886.5,216.9141,896.5,220.9141,886.5,224.9141,890.5,220.9141" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="337.5" x2="892.5" y1="220.9141" y2="220.9141"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="534" x="344.5" y="215.8481">5. any modification/deletion: Save(model.jsonc) full rewrite (comments may be lost)</text><polygon fill="#A80036" points="90.5,246.0469,80.5,250.0469,90.5,254.0469,86.5,250.0469" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="84.5" x2="336.5" y1="250.0469" y2="250.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="62" x="96.5" y="244.981">6. 'Saved'</text><!--MD5=[f8c7349b74c8c3d564ba7d4cd308d94b]
@startuml repl_save
title REPL Save: Patch vs. Full-Save Fallback

participant "Software Architect" as architect
participant "Interactive" as bausteinsicht_cli_interactive
participant "Validate" as bausteinsicht_model_validate
participant "Patch" as bausteinsicht_model_patch
participant "Loader" as bausteinsicht_model_loader

architect -> bausteinsicht_cli_interactive : 1. add / remove / edit ... then `save`
bausteinsicht_cli_interactive -> bausteinsicht_model_validate : 2. Validate(in-memory model)
bausteinsicht_model_validate - -> bausteinsicht_cli_interactive : 3. valid, or 'save aborted — N validation error(s)'
bausteinsicht_cli_interactive -> bausteinsicht_model_patch : 4. pure additions: PatchInsert / AppendArrayEntry (comments preserved)
bausteinsicht_cli_interactive -> bausteinsicht_model_loader : 5. any modification/deletion: Save(model.jsonc) full rewrite (comments may be lost)
bausteinsicht_cli_interactive - -> architect : 6. 'Saved'

@enduml

